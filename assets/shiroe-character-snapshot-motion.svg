<svg id="svg42" width="960" height="540" aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg"><title id="title">Shiroe character snapshot</title><desc id="desc">The Anonymous Tactician, rendered as a minimal graphite, frost, cyan, amber, and violet repository snapshot.</desc><defs id="defs4"><linearGradient id="violetEdge" y2="1"><stop id="stop1" stop-color="#C026D3" offset="0"/><stop id="stop2" stop-color="#6B21A8" offset="1"/></linearGradient><linearGradient id="cyanEdge" y2="1"><stop id="stop3" stop-color="#A8F5FF" offset="0"/><stop id="stop4" stop-color="#55C7D9" offset="1"/></linearGradient><style id="style4"><![CDATA[
      .frost { stroke:#EEF3F7; }
      .cyan { stroke:#55C7D9; }
      .violet { stroke:#C026D3; }
      .amber { stroke:#E7B75A; }
      .round { stroke-linecap:round; stroke-linejoin:round; }

      .orbit-a {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbitA 28s linear infinite;
      }
      .orbit-b {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbitB 36s linear infinite;
      }
      .lens-glow {
        transform-box: fill-box;
        transform-origin: center;
        animation: lensBreath 5.8s ease-in-out infinite;
      }
      .gate-live {
        transform-box: fill-box;
        transform-origin: center;
        animation: gateBreath 4.9s ease-in-out infinite;
      }
      .route-flow {
        animation: routeFlow 12s linear infinite;
      }
      .signal-live {
        animation: signalBreath 6.6s ease-in-out infinite;
      }
      .particle-one { animation: driftOne 13s ease-in-out infinite; }
      .particle-two { animation: driftTwo 17s ease-in-out infinite; }

      @keyframes orbitA {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitB {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes lensBreath {
        0%, 100% { opacity: .04; transform: scale(.985); }
        50% { opacity: .13; transform: scale(1.025); }
      }
      @keyframes gateBreath {
        0%, 100% { opacity: .84; transform: scale(.99); }
        50% { opacity: 1; transform: scale(1.018); }
      }
      @keyframes routeFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -180; }
      }
      @keyframes signalBreath {
        0%, 100% { opacity: .58; }
        50% { opacity: .96; }
      }
      @keyframes driftOne {
        0%, 100% { transform: translate(0,0); opacity: .16; }
        50% { transform: translate(18px,-7px); opacity: .42; }
      }
      @keyframes driftTwo {
        0%, 100% { transform: translate(0,0); opacity: .13; }
        50% { transform: translate(-14px,8px); opacity: .36; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit-a, .orbit-b, .lens-glow, .gate-live,
        .route-flow, .signal-live, .particle-one, .particle-two {
          animation: none !important;
        }
      }

    ]]></style></defs><rect id="rect4" width="1672" height="941" fill="#0C1017"/><rect id="rect5" x="24" y="24" width="1624" height="893" rx="24" fill="none" stroke="#95A2B3" stroke-opacity=".08"/><!-- Quiet background field --><g id="g7" opacity=".2"><circle id="circle5" class="orbit-a" cx="836" cy="370" r="315" fill="none" stroke="#6B21A8" stroke-dasharray="2 16" stroke-width="1.4"/><circle id="circle6" class="orbit-b" cx="836" cy="370" r="272" fill="none" stroke="#55C7D9" stroke-dasharray="26 72" stroke-width="1.2"/><path id="path6" class="route-flow" d="m206 465h272" stroke="#C026D3" stroke-dasharray="52 14 8 24" stroke-width="1.5"/><path id="path7" class="route-flow" d="m1194 465h272" stroke="#55C7D9" stroke-dasharray="52 14 8 24" stroke-width="1.5"/></g><!-- Character bust --><g id="tactician" transform="translate(0,-45)"><!-- shoulders --><path id="path8" class="round" d="m496 676c69-48 126-68 188-80h304c62 12 119 32 188 80l67 53c-91 20-196 35-300 41h-214c-104-6-209-21-300-41z" fill="#080B10" stroke="#EEF3F7" stroke-width="4"/><path id="path9" class="round" d="m460 716c100-32 178-47 255-52" fill="none" opacity=".85" stroke="url(#violetEdge)" stroke-width="5"/><path id="path10" class="round" d="m1212 716c-100-32-178-47-255-52" fill="none" opacity=".75" stroke="url(#cyanEdge)" stroke-width="5"/><!-- neck shadow --><path id="path11" d="m742 514h188l33 147h-254z" fill="#06080D"/><!-- high collar left --><path id="path12" class="round" d="m538 501c35-30 81-55 145-70l69 43 27 193-77-22-94-48z" fill="#0A0E15" stroke="#EEF3F7" stroke-width="7"/><path id="path13" class="round" d="m548 509 137-66 59 39 11 138" fill="none" opacity=".54" stroke="#95A2B3" stroke-width="2.4"/><path id="path14" class="round" d="m550 507 65-31" fill="none" opacity=".9" stroke="#C026D3" stroke-width="5"/><!-- high collar right --><path id="path15" class="round" d="m1134 501c-35-30-81-55-145-70l-69 43-27 193 77-22 94-48z" fill="#0A0E15" stroke="#EEF3F7" stroke-width="7"/><path id="path16" clas