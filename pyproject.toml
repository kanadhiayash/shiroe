# privacy-audit: allow-file "Package metadata. Author name + description + keywords are public-package metadata by design, not user data."
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiroe"
version = "3.0.0-alpha.1"
description = "Zeref Memory Engine — local-first context and memory engine for AI harnesses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "memory", "context", "llm", "agent", "zeref"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core: stdlib only — zero mandatory deps
dependencies = []

[project.optional-dependencies]
llm       = ["litellm>=1.0"]    # zeref grade (LLM-enhanced)
duckdb    = ["duckdb>=0.10"]    # zeref db snapshot --parquet
yaml      = ["pyyaml>=6.0"]     # richer REDACT.md YAML parsing
tokenizer = ["tiktoken>=0.5"]   # cost_router token estimate (model-family tokenizer)
# benchmarks/external: dataset loaders, judge clients, scoring — dev/test
# only, never a runtime dependency of `pip install zeref-os`. `benchmarks/`
# itself isn't packaged (see [tool.setuptools.packages.find] below); this
# extra exists so any future third-party dep (e.g. a Gemini SDK) lands here,
# never in core. Empty today — stdlib covers everything built so far (BM25,
# cost estimator, fake/estimate-only judge clients).
benchmark = []
all       = ["litellm>=1.0", "duckdb>=0.10", "pyyaml>=6.0", "tiktoken>=0.5"]

[project.scripts]
shiroe = "shiroe.cli:main"

[project.urls]
Homepage  = "https://github.com/kanadhiayash/shiroe"
Changelog = "https://github.com/kanadhiayash/shiroe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where   = ["."]
include = ["shiroe*"]

[tool.setuptools.package-data]
shiroe = ["VERSION", "IDENTITY.json", "adapters/*.json", "adapters/providers/*.json"]
